<!-- 6. Write a JavaScript program to validate form inputs by checking empty 
fields and validating email format before submission.  -->

<!-- <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Form Validation</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 30px;
        }

        .form-box {
            max-width: 300px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
            display: block;
        }

        .error {
            color: red;
            font-size: 12px;
            height: 15px;
        }

        button {
            width: 100%;
            padding: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="form-box">
        <h2>Login</h2>
        <form id="vForm" onsubmit="return validate()">
            <input type="text" id="name" placeholder="Name">
            <div id="nErr" class="error"></div>

            <input type="text" id="email" placeholder="Email">
            <div id="eErr" class="error"></div>

            <button type="submit">Submit</button>
        </form>
    </div>

    <script>
        function validate() {
            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let nErr = document.getElementById("nErr");
            let eErr = document.getElementById("eErr");
            let valid = true;

            nErr.innerText = "";
            eErr.innerText = "";

            if (name.trim() === "") {
                nErr.innerText = "Name is required";
                valid = false;
            }

            let pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (email.trim() === "") {
                eErr.innerText = "Email is required";
                valid = false;
            } else if (!pattern.test(email)) {
                eErr.innerText = "Invalid email format";
                valid = false;
            }

            if (valid) alert("Success!");
            return valid;
        }
    </script>

</body>

</html> -->

<!-- 8. Develop a simple calculator using JavaScript functions and switch-case 
statements to perform arithmetic operations.  -->

<!-- <!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Simple Calculator</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            padding: 50px;
        }

        .calc-box {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            width: 250px;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        #res {
            text-align: center;
            font-weight: bold;
            font-size: 1.2em;
            color: #333;
        }
    </style>
</head>

<body>
    <div class="calc-box">
        <input type="number" id="n1" placeholder="Number 1" />
        <input type="number" id="n2" placeholder="Number 2" />

        <select id="op">
            <option value="add">Add (+)</option>
            <option value="sub">Subtract (-)</option>
            <option value="mul">Multiply (*)</option>
            <option value="div">Divide (/)</option>
        </select>

        <button onclick="calc()">Calculate</button>
        <div id="res">Result: 0</div>
    </div>

    <script>
        function calc() {
            let a = parseFloat(document.getElementById("n1").value);
            let b = parseFloat(document.getElementById("n2").value);
            let op = document.getElementById("op").value;
            let result;

            switch (op) {
                case "add":
                    result = a + b;
                    break;
                case "sub":
                    result = a - b;
                    break;
                case "mul":
                    result = a * b;
                    break;
                case "div":
                    result = b !== 0 ? a / b : "Error (Div by 0)";
                    break;
                default:
                    result = "Invalid";
            }

            document.getElementById("res").innerText = "Result: " + result;
        }
    </script>
</body>

</html> -->
